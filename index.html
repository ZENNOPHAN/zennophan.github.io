<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a2e">
<title>PokéBlast</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&display=swap');
:root{
  --red:#CC0000;--yellow:#FFCB05;--blue:#3B4CCA;--elec:#FFC107;
  --bg1:#1a1a2e;--bg2:#16213e;--p1:#0f3460;--p2:#1a1a6e;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg1);
  font-family:'Press Start 2P',monospace;user-select:none;-webkit-user-select:none}
body{display:flex;flex-direction:column;align-items:center;
  background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%)}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(1px 1px at 8% 12%,rgba(255,255,255,.9) 0%,transparent 100%),
    radial-gradient(2px 2px at 22% 55%,rgba(255,203,5,.9) 0%,transparent 100%),
    radial-gradient(1px 1px at 38% 22%,rgba(255,255,255,.8) 0%,transparent 100%),
    radial-gradient(2px 2px at 55% 78%,rgba(255,203,5,.7) 0%,transparent 100%),
    radial-gradient(1px 1px at 68% 35%,rgba(255,255,255,.9) 0%,transparent 100%),
    radial-gradient(1px 1px at 80% 68%,rgba(255,255,255,.7) 0%,transparent 100%),
    radial-gradient(2px 2px at 90% 18%,rgba(255,203,5,.8) 0%,transparent 100%),
    radial-gradient(1px 1px at 14% 88%,rgba(255,255,255,.6) 0%,transparent 100%),
    radial-gradient(1px 1px at 45% 5%,rgba(255,203,5,.6) 0%,transparent 100%);
  animation:twinkle 5s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.35}to{opacity:1}}

#app{position:relative;z-index:1;width:100%;max-width:520px;height:100%;
  display:flex;flex-direction:column;align-items:center;overflow:hidden}

/* ── TOP BAR ── */
#topbar{width:100%;display:flex;align-items:center;justify-content:space-between;
  padding:5px 8px 3px;
  background:linear-gradient(180deg,rgba(15,52,96,.95) 0%,transparent 100%);
  border-bottom:2px solid rgba(255,203,5,.4);flex-shrink:0}
.title-wrap{text-align:center;flex:1}
.gtitle{font-size:clamp(9px,3vw,14px);color:var(--yellow);white-space:nowrap;
  text-shadow:1px 1px 0 var(--red),0 0 16px rgba(255,203,5,.95)}
.gsub{font-family:'VT323',monospace;font-size:clamp(11px,3.5vw,16px);color:var(--blue);letter-spacing:2px}
.sbox{background:linear-gradient(145deg,var(--p1),var(--p2));border:2px solid var(--yellow);
  border-radius:8px;padding:3px 6px;text-align:center;min-width:64px;
  box-shadow:0 0 10px rgba(255,203,5,.3)}
.slabel{font-size:5px;color:var(--yellow);letter-spacing:1px}
.sval{font-size:clamp(8px,2.5vw,12px);color:#fff;text-shadow:0 0 8px var(--yellow);margin-top:1px}

/* ── STAT ROW ── */
#statrow{width:100%;display:flex;align-items:center;padding:3px 6px;flex-shrink:0;gap:4px}
.pill{background:rgba(15,52,96,.85);border:1px solid rgba(255,203,5,.4);border-radius:20px;
  padding:2px 6px;display:flex;align-items:center;gap:3px;flex:1;justify-content:center}
.plabel{font-size:5px;color:var(--yellow)}
.pval{font-family:'VT323',monospace;font-size:clamp(11px,3.5vw,16px);color:#fff}
.partner{display:flex;align-items:center;gap:4px;background:rgba(15,52,96,.85);
  border:1px solid rgba(255,203,5,.4);border-radius:20px;padding:2px 6px}
#pEmoji{font-size:clamp(14px,4vw,20px);animation:bob 1s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.pname{font-family:'VT323',monospace;font-size:clamp(9px,2.5vw,12px);color:#fff}
.hpbar{width:44px;height:4px;background:rgba(0,0,0,.5);border-radius:2px;overflow:hidden}
.hpfill{height:100%;border-radius:2px;background:linear-gradient(90deg,#4CAF50,#8BC34A);transition:width .4s,background .4s}

/* ── XP ── */
.xpwrap{width:calc(100% - 12px);height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.xpfill{height:100%;background:linear-gradient(90deg,var(--blue),var(--yellow));border-radius:2px;transition:width .4s}

/* ── CANVAS AREA ── */
#canvwrap{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;
  padding:3px 6px;overflow:hidden;gap:5px}

/* The main grid box + flash/shake animations */
.gbox{background:linear-gradient(145deg,#070717,#0d1835);border:3px solid var(--yellow);
  border-radius:10px;padding:4px;position:relative;flex-shrink:0;
  box-shadow:0 0 22px rgba(255,203,5,.45),0 0 45px rgba(59,76,202,.3),inset 0 0 22px rgba(0,0,60,.5)}

@keyframes gridFlash{
  0%  {box-shadow:0 0 22px rgba(255,203,5,.45),0 0 45px rgba(59,76,202,.3),inset 0 0 22px rgba(0,0,60,.5)}
  30% {box-shadow:0 0 80px #FFD700,0 0 130px rgba(255,220,0,.9),0 0 30px #fff,inset 0 0 35px rgba(255,220,0,.45)}
  100%{box-shadow:0 0 22px rgba(255,203,5,.45),0 0 45px rgba(59,76,202,.3),inset 0 0 22px rgba(0,0,60,.5)}}
@keyframes gridShake{
  10%{transform:translate(-5px,-2px) rotate(-.5deg)}
  25%{transform:translate(5px,2px) rotate(.5deg)}
  40%{transform:translate(-4px,0)}
  55%{transform:translate(4px,1px) rotate(.3deg)}
  70%{transform:translate(-2px,-1px)}
  85%{transform:translate(2px,0)}
  100%{transform:translate(0,0)}}
.gbox.flash{animation:gridFlash .55s ease-out}
.gbox.shake{animation:gridShake .42s ease-in-out}

#gameCanvas{display:block;border-radius:6px;touch-action:none;image-rendering:pixelated}

/* ── PIECE TRAY ── */
.pbox{background:linear-gradient(145deg,var(--p1),var(--p2));border:2px solid var(--yellow);
  border-radius:10px;padding:4px;box-shadow:0 0 14px rgba(255,203,5,.3);width:100%;flex-shrink:0}
.pboxlabel{font-size:5px;color:var(--yellow);text-align:center;margin-bottom:2px;letter-spacing:1px}
#piecesCanvas{display:block;touch-action:none;margin:0 auto;cursor:grab;image-rendering:pixelated}

/* ── FLOATING DRAG ── */
#dragCanvas{position:fixed;top:0;left:0;pointer-events:none;z-index:900;display:none;
  transform:translate3d(-9999px,-9999px,0);will-change:transform;
  image-rendering:pixelated;
  filter:drop-shadow(0 14px 28px rgba(0,0,0,.85)) brightness(1.15)}

/* ── COMBO TOAST ── */
#comboToast{position:fixed;top:42%;left:50%;transform:translate(-50%,-50%) scale(0);
  font-size:clamp(15px,6vw,26px);color:var(--yellow);pointer-events:none;z-index:500;
  text-shadow:2px 2px 0 var(--red),0 0 20px gold;white-space:nowrap;
  transition:transform .15s cubic-bezier(.175,.885,.32,1.275)}
#comboToast.show{transform:translate(-50%,-50%) scale(1)}

/* ── CLEAR TEXT ── */
.clearText{position:absolute;font-family:'Press Start 2P',monospace;
  font-size:clamp(10px,3.5vw,16px);color:#FFD700;
  text-shadow:0 0 12px gold,2px 2px 0 var(--red);
  pointer-events:none;z-index:60;white-space:nowrap;
  left:50%;animation:clearFloat 1.1s ease-out forwards}
@keyframes clearFloat{
  0%  {opacity:0;transform:translateX(-50%) translateY(0) scale(.5)}
  20% {opacity:1;transform:translateX(-50%) translateY(-12px) scale(1.1)}
  55% {opacity:1;transform:translateX(-50%) translateY(-26px) scale(1)}
  100%{opacity:0;transform:translateX(-50%) translateY(-60px) scale(.9)}}

/* ── SCORE POPUP ── */
.spop{position:absolute;font-size:clamp(8px,3vw,13px);color:var(--yellow);
  text-shadow:1px 1px 0 var(--red),0 0 8px gold;pointer-events:none;z-index:55;
  animation:floatUp .9s ease-out forwards;white-space:nowrap}
@keyframes floatUp{
  0%  {opacity:1;transform:translateY(0) scale(1)}
  100%{opacity:0;transform:translateY(-55px) scale(1.5)}}

/* ── BUTTONS ── */
#btnrow{width:100%;display:flex;gap:6px;padding:3px 8px 6px;flex-shrink:0}
.btn{flex:1;padding:7px 4px;font-family:'Press Start 2P',monospace;
  font-size:clamp(6px,1.6vw,8px);color:var(--yellow);
  background:linear-gradient(145deg,var(--red),#880000);
  border:2px solid var(--yellow);border-radius:8px;cursor:pointer;
  box-shadow:0 3px 0 #550000,0 0 10px rgba(204,0,0,.4);transition:all .1s;
  -webkit-tap-highlight-color:transparent}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #550000}

/* ── GAME OVER OVERLAY ── */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;
  align-items:center;justify-content:center;z-index:800;backdrop-filter:blur(8px)}
#overlay.hidden{display:none}
.modal{background:linear-gradient(145deg,var(--p1),var(--p2));
  border:3px solid var(--yellow);border-radius:16px;padding:22px 18px;
  text-align:center;box-shadow:0 0 55px rgba(255,203,5,.65);width:min(330px,92vw)}
.modal-pb{font-size:52px;display:block;filter:drop-shadow(0 0 14px gold);margin-bottom:8px;
  animation:spinPb 3s linear infinite}
@keyframes spinPb{
  0%{transform:rotate(0deg) scale(1)}25%{transform:rotate(90deg) scale(1.1)}
  50%{transform:rotate(180deg) scale(1)}75%{transform:rotate(270deg) scale(1.1)}
  100%{transform:rotate(360deg) scale(1)}}
.mtitle{font-size:clamp(11px,4vw,15px);color:var(--yellow);text-shadow:0 0 12px var(--yellow);margin-bottom:6px}
.msub{font-family:'VT323',monospace;font-size:clamp(14px,5vw,20px);color:#fff;margin-bottom:14px}
.mscore{font-size:clamp(7px,2.5vw,10px);color:var(--elec);margin-bottom:3px}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="sbox"><div class="slabel">SCORE</div><div class="sval" id="scoreVal">0</div></div>
    <div class="title-wrap"><div class="gtitle">POKÉBLAST</div><div class="gsub">◆ BLOCK EDITION ◆</div></div>
    <div class="sbox"><div class="slabel">BEST</div><div class="sval" id="bestVal">0</div></div>
  </div>
  <div id="statrow">
    <div class="partner">
      <span id="pEmoji">⚡</span>
      <div><div class="pname" id="pName">PIKACHU</div><div class="hpbar"><div class="hpfill" id="hpFill"></div></div></div>
    </div>
    <div class="pill"><span class="plabel">LV</span><span class="pval" id="lvVal">1</span></div>
    <div class="pill"><span class="plabel">COMBO</span><span class="pval" id="comboVal" style="color:var(--elec)">x1</span></div>
    <div class="pill"><span class="plabel">LINES</span><span class="pval" id="linesVal">0</span></div>
  </div>
  <div style="width:calc(100% - 12px);padding:0 0 2px"><div class="xpwrap"><div class="xpfill" id="xpFill" style="width:0%"></div></div></div>
  <div id="canvwrap">
    <div class="gbox" id="gbox"><canvas id="gameCanvas" touch-action="none"></canvas></div>
    <div class="pbox">
      <div class="pboxlabel">— DRAG PIECES TO BOARD —</div>
      <canvas id="piecesCanvas" touch-action="none"></canvas>
    </div>
  </div>
  <div id="btnrow">
    <button class="btn" onclick="restartGame()">↺ RESTART</button>
    <button class="btn" id="muteBtn" onclick="toggleMute()">🔊 SOUND</button>
  </div>
</div>

<canvas id="dragCanvas"></canvas>
<div id="comboToast"></div>
<div id="overlay" class="hidden">
  <div class="modal">
    <span class="modal-pb">⚫</span>
    <div class="mtitle">GAME OVER!</div>
    <div class="msub" id="goPartner">Pokémon fainted...</div>
    <div class="mscore" id="goScore"></div>
    <div class="mscore" id="goBest"></div>
    <br>
    <button class="btn" onclick="restartGame()" style="font-size:clamp(7px,2.5vw,10px);padding:12px">▶ PLAY AGAIN</button>
  </div>
</div>

<script>
'use strict';
// ────────────────────────────────────────────
//  PokéBlast v4 — Complete Rewrite
// ────────────────────────────────────────────

const GRID    = 9;
const N_SLOTS = 4;
const DPR     = Math.min(window.devicePixelRatio || 1, 3);

// ── 12 Pokemon Types ────────────────────────
const TYPES = [
  { n:'FIRE',     s:'FIR', c:'#E85820', g:'#FF7040', e:'🔥', d:'#8B1A00' },
  { n:'WATER',    s:'WAT', c:'#2E78E8', g:'#55AAFF', e:'💧', d:'#083070' },
  { n:'GRASS',    s:'GRS', c:'#3CC830', g:'#60EE44', e:'🌿', d:'#0A4010' },
  { n:'ELECTRIC', s:'ELC', c:'#F8C800', g:'#FFE444', e:'⚡', d:'#705800' },
  { n:'PSYCHIC',  s:'PSY', c:'#E03880', g:'#FF65A8', e:'🔮', d:'#7A0035' },
  { n:'POISON',   s:'PSN', c:'#9040C8', g:'#C060F0', e:'☠️', d:'#3A0058' },
  { n:'ICE',      s:'ICE', c:'#48D8D8', g:'#80FFFF', e:'❄️', d:'#004848' },
  { n:'DRAGON',   s:'DRG', c:'#5028F8', g:'#7855FF', e:'🐉', d:'#180080' },
  { n:'FIGHTING', s:'FGT', c:'#C02800', g:'#FF4820', e:'🥊', d:'#600000' },
  { n:'GHOST',    s:'GHO', c:'#685898', g:'#9878C0', e:'👻', d:'#201038' },
  { n:'ROCK',     s:'ROK', c:'#B89028', g:'#E8C040', e:'🪨', d:'#504010' },
  { n:'DARK',     s:'DRK', c:'#685038', g:'#907060', e:'🌑', d:'#201008' },
];

// ── Weighted Shapes ──────────────────────────
// w = weight (higher → appears more often)
// Easy line-clearing shapes have high weight
const SHAPES_W = [
  // EASY: w 5-8
  {s:[[1]],                w:4},
  {s:[[1,1]],              w:7},  // fills 2 in a row
  {s:[[1],[1]],            w:7},  // fills 2 in a col
  {s:[[1,1,1]],            w:9},  // KEY: 3-wide strip
  {s:[[1],[1],[1]],        w:9},  // KEY: 3-tall strip
  {s:[[1,1],[1,1]],        w:7},  // 2x2 square
  {s:[[1,1,1,1]],          w:6},  // KEY: 4-wide strip
  {s:[[1],[1],[1],[1]],    w:6},  // KEY: 4-tall strip
  {s:[[1,1,1],[1,1,1]],   w:5},  // 3x2 rect
  {s:[[1,1],[1,1],[1,1]], w:5},  // 2x3 rect
  // Small L corners (easy, very versatile)
  {s:[[1,1],[1,0]],        w:6},
  {s:[[1,1],[0,1]],        w:6},
  {s:[[1,0],[1,1]],        w:6},
  {s:[[0,1],[1,1]],        w:6},
  // MEDIUM: w 3-4
  {s:[[1,0],[1,0],[1,1]], w:3},  // L
  {s:[[0,1],[0,1],[1,1]], w:3},  // J
  {s:[[1,1],[1,0],[1,0]], w:3},  // L flip
  {s:[[1,1],[0,1],[0,1]], w:3},  // J flip
  {s:[[1,1,1],[0,1,0]],   w:3},  // T down
  {s:[[0,1,0],[1,1,1]],   w:3},  // T up
  {s:[[1,0],[1,1],[1,0]], w:3},  // T right
  {s:[[0,1],[1,1],[0,1]], w:3},  // T left
  {s:[[0,1,1],[1,1,0]],   w:3},  // S
  {s:[[1,1,0],[0,1,1]],   w:3},  // Z
  // HARD: w 1-2
  {s:[[0,1,0],[1,1,1],[0,1,0]], w:1},  // Plus
  {s:[[1,0,1],[1,1,1]],          w:1},  // U
  {s:[[1,1,1],[1,0,1]],          w:1},  // U flip
  {s:[[1,1],[0,1],[1,1]],        w:1},
  {s:[[1,1],[1,0],[1,1]],        w:1},
  {s:[[1,1,1,1,1]],              w:1},  // 5-wide
  {s:[[1],[1],[1],[1],[1]],      w:1},  // 5-tall
  {s:[[1,1,1],[1,0,0],[1,0,0]], w:1},  // corner TL
  {s:[[1,1,1],[0,0,1],[0,0,1]], w:1},  // corner TR
  {s:[[1,1,0],[1,1,1]],          w:2},
  {s:[[0,1,1],[1,1,1]],          w:2},
];
const TOTAL_W = SHAPES_W.reduce((a,{w})=>a+w,0);

function rndShape() {
  let r = Math.random()*TOTAL_W;
  for (const {s,w} of SHAPES_W) { r-=w; if(r<=0) return s; }
  return SHAPES_W[0].s;
}

const PARTNERS = [
  {e:'⚡',n:'PIKACHU',   hp:100},
  {e:'🔥',n:'CHARIZARD', hp:120},
  {e:'💧',n:'BLASTOISE', hp:110},
  {e:'🌿',n:'VENUSAUR',  hp:115},
  {e:'❄️',n:'ARTICUNO',  hp:90 },
  {e:'🔮',n:'ALAKAZAM',  hp:85 },
  {e:'🐉',n:'DRAGONITE', hp:130},
  {e:'☠️',n:'GENGAR',    hp:95 },
  {e:'🥊',n:'MACHAMP',   hp:105},
  {e:'👻',n:'HAUNTER',   hp:88 },
];

// ── Canvas References ────────────────────────
const gc  = document.getElementById('gameCanvas');
const pc  = document.getElementById('piecesCanvas');
const drc = document.getElementById('dragCanvas');
const gx  = gc.getContext('2d');
const px  = pc.getContext('2d');
const dx  = drc.getContext('2d');

let CS=40, GW=0, GH=0, PW=0, PH=0;

function resizeCanvas(c,ctx,cssW,cssH){
  c.style.width =cssW+'px'; c.style.height=cssH+'px';
  c.width=Math.round(cssW*DPR); c.height=Math.round(cssH*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}

function PCS(){ return Math.round(CS*0.44); }

function calcSizes(){
  const wrap=document.getElementById('canvwrap');
  const avH=wrap.clientHeight, avW=wrap.clientWidth-12;
  const pE=44, pF=1.5;
  let csH=Math.floor((avH-14-5-pE)/(GRID+pF));
  let csW=Math.floor(avW/GRID);
  CS=Math.min(csH,csW,52); CS=Math.max(CS,24);
  GW=CS*GRID; GH=CS*GRID;
  resizeCanvas(gc,gx,GW,GH);
  const pcsz=PCS();
  PH=Math.max(pcsz*4+10,CS+10); PW=Math.min(GW,avW);
  resizeCanvas(pc,px,PW,PH);
  refreshPiecePositions();
}

// ── State ────────────────────────────────────
let grid,pieces,score,best,level,xp,xpMax;
let combo,comboTimer,linesCleared,partner,partnerHp;
let dragging=null,gameOver=false;
let animCells=[],particles=[],muted=false;

// ── Audio ─────────────────────────────────────
let ac=null;
function getAC(){
  if(!ac){const A=window.AudioContext||window.webkitAudioContext;if(A)ac=new A();}
  return ac;
}
function tone(freq,t,dur,type='sine',vol=0.14,atk=0.008){
  if(muted)return;
  try{
    const ctx=getAC();if(!ctx)return;
    if(ctx.state==='suspended')ctx.resume().catch(()=>{});
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.type=type;o.frequency.value=freq;
    const now=ctx.currentTime+t;
    g.gain.setValueAtTime(0,now);
    g.gain.linearRampToValueAtTime(vol,now+atk);
    g.gain.exponentialRampToValueAtTime(0.001,now+dur);
    o.start(now);o.stop(now+dur+0.02);
  }catch(e){}
}

const N={
  C3:130.8,G3:196,C4:261.6,D4:293.7,Eb4:311.1,E4:329.6,F4:349.2,
  G4:392,Ab4:415.3,A4:440,Bb4:466.2,B4:493.9,
  C5:523.3,D5:587.3,Eb5:622.3,E5:659.3,G5:784,A5:880,C6:1046.5,G6:1568
};

function sfxPlace(){
  tone(200,0,.12,'triangle',.2,.005);
  tone(400,0,.07,'sine',.08,.003);
}
function sfxClear(n){
  const m=n>=3?[N.C4,N.E4,N.G4,N.C5,N.E5,N.G5]:[N.C4,N.E4,N.G4,N.C5];
  m.forEach((f,i)=>tone(f,i*.055,.3,'sine',.16,.008));
  tone(N.C6,0,.45,'sine',.09,.002);
  if(n>=2)[N.E5,N.G5].forEach((f,i)=>tone(f,.32+i*.07,.25,'sine',.07));
}
function sfxCombo(n){
  const v=Math.min(.22,.1+n*.02);
  [N.C4,N.E4,N.G4].forEach(f=>tone(f,0,.35,'square',v*.35,.01));
  const mel=[N.G4,N.A4,N.B4,N.C5,N.D5,N.E5,N.G5];
  mel.slice(0,Math.min(n+2,mel.length)).forEach((f,i)=>tone(f,i*.05,.22,'sine',v,.005));
  [N.C6,N.G5].forEach((f,i)=>tone(f,.32+i*.07,.15,'sine',.08,.002));
}
function sfxLvlUp(){
  [[N.C4,0],[N.E4,.1],[N.G4,.2],[N.C5,.32],[N.E5,.46],[N.G5,.62],[N.C6,.8]].forEach(([f,t])=>{
    tone(f,t,.5,'sine',.18,.01);
    tone(f*.5,t,.5,'sine',.07,.01);
  });
  [N.C5,N.E5,N.G5,N.C6].forEach(f=>tone(f,.9,.65,'sine',.15,.02));
}
function sfxGameOver(){
  [[N.G4,0],[N.Eb4,.22],[N.C4,.44],[N.G3,.66],[N.C3,.9]].forEach(([f,t])=>
    tone(f,t,.5,'triangle',.14,.03));
}
function toggleMute(){
  muted=!muted;
  document.getElementById('muteBtn').textContent=muted?'🔇 MUTED':'🔊 SOUND';
}

// ── Drawing Helpers ──────────────────────────
function rr(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}
function lht(hex,p){
  const n=parseInt(hex.replace('#',''),16);
  return '#'+[Math.min(255,(n>>16)+p),Math.min(255,((n>>8)&0xff)+p),Math.min(255,(n&0xff)+p)]
    .map(v=>v.toString(16).padStart(2,'0')).join('');
}
function drk(hex,p){
  const n=parseInt(hex.replace('#',''),16);
  return '#'+[Math.max(0,(n>>16)-p),Math.max(0,((n>>8)&0xff)-p),Math.max(0,(n&0xff)-p)]
    .map(v=>v.toString(16).padStart(2,'0')).join('');
}

// ── Pokemon-Themed Block Drawing ─────────────
// DPR is handled by the canvas transform, so sz is in CSS px
function drawCell(ctx,x,y,sz,t,alpha=1){
  if(alpha<=0)return;
  ctx.save();
  ctx.globalAlpha=alpha;
  const pad=2,r=Math.max(3,sz*.12);
  const ix=x+pad,iy=y+pad,iw=sz-pad*2,ih=sz-pad*2;

  // Glow shadow
  ctx.shadowColor=t.g; ctx.shadowBlur=sz>=32?10:5;

  // Main 3-stop gradient
  const bg=ctx.createLinearGradient(ix,iy,ix+iw,iy+ih);
  bg.addColorStop(0,lht(t.c,55));
  bg.addColorStop(.45,t.c);
  bg.addColorStop(1,drk(t.c,32));
  rr(ctx,ix,iy,iw,ih,r); ctx.fillStyle=bg; ctx.fill();
  ctx.shadowBlur=0;

  // Diagonal highlight band
  ctx.save();
  rr(ctx,ix,iy,iw,ih,r); ctx.clip();
  ctx.globalAlpha=alpha*.1;
  ctx.fillStyle='#fff';
  ctx.fillRect(ix+iw*.52,iy,iw*.55,ih);
  ctx.globalAlpha=alpha;
  ctx.restore();

  // Top shine
  const sh=ctx.createLinearGradient(ix,iy,ix,iy+ih*.55);
  sh.addColorStop(0,'rgba(255,255,255,.44)');
  sh.addColorStop(.5,'rgba(255,255,255,.08)');
  sh.addColorStop(1,'rgba(255,255,255,0)');
  rr(ctx,ix,iy,iw,ih,r); ctx.fillStyle=sh; ctx.fill();

  // Outer border
  ctx.strokeStyle=t.g; ctx.lineWidth=1.8;
  rr(ctx,ix,iy,iw,ih,r); ctx.stroke();

  // Inner border accent
  ctx.strokeStyle='rgba(0,0,0,.22)'; ctx.lineWidth=.7;
  rr(ctx,ix+2,iy+2,iw-4,ih-4,Math.max(1,r-1)); ctx.stroke();

  // ── Pokéball badge (top-right) ──
  if(sz>=30){
    const bx=ix+iw-6,by=iy+6,br=4;
    ctx.shadowColor='rgba(0,0,0,.5)'; ctx.shadowBlur=3;
    ctx.fillStyle='rgba(0,0,0,.28)';
    ctx.beginPath();ctx.arc(bx,by,br+.5,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    // Top white
    ctx.fillStyle='#f2f2f2';
    ctx.beginPath();ctx.arc(bx,by,br,Math.PI,0);ctx.fill();
    // Bottom red
    ctx.fillStyle='#CC0000';
    ctx.beginPath();ctx.arc(bx,by,br,0,Math.PI);ctx.fill();
    // Band
    ctx.strokeStyle='#111';ctx.lineWidth=.75;
    ctx.beginPath();ctx.moveTo(bx-br,by);ctx.lineTo(bx+br,by);ctx.stroke();
    // Center button
    ctx.fillStyle='#fff';ctx.strokeStyle='#444';ctx.lineWidth=.5;
    ctx.beginPath();ctx.arc(bx,by,1.3,0,Math.PI*2);ctx.fill();ctx.stroke();
  }

  // ── Emoji (centered, crisp via DPR) ──
  if(sz>=24){
    const fs=Math.floor(sz*(sz>=40?.38:.40));
    ctx.font=`${fs}px Arial, sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.globalAlpha=alpha*.95;
    // Slight upward offset to balance pokeball + type label
    ctx.fillText(t.e, x+sz/2, sz>=40?y+sz*.51:y+sz/2+1);
  }

  // ── Type label (bottom, only if large enough) ──
  if(sz>=40){
    const fs2=Math.floor(sz*.115);
    ctx.font=`bold ${fs2}px Arial, sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.globalAlpha=alpha*.45;
    ctx.fillStyle='rgba(0,0,0,.6)';
    ctx.fillText(t.s, x+sz/2+.5, y+sz-2.5);
    ctx.globalAlpha=alpha*.7;
    ctx.fillStyle='#fff';
    ctx.fillText(t.s, x+sz/2, y+sz-3);
  }

  ctx.restore();
}

// ── Grid Render ──────────────────────────────
function drawGrid(){
  gx.clearRect(0,0,GW,GH);
  // Grid lines
  gx.strokeStyle='rgba(255,203,5,.055)'; gx.lineWidth=1;
  for(let i=0;i<=GRID;i++){
    gx.beginPath();gx.moveTo(i*CS,0);gx.lineTo(i*CS,GH);gx.stroke();
    gx.beginPath();gx.moveTo(0,i*CS);gx.lineTo(GW,i*CS);gx.stroke();
  }
  // Placed cells
  for(let r=0;r<GRID;r++) for(let c=0;c<GRID;c++){
    if(grid[r][c]) drawCell(gx,c*CS,r*CS,CS,grid[r][c]);
    else{
      gx.fillStyle='rgba(255,255,255,.02)';
      gx.fillRect(c*CS+CS/2-1.5,r*CS+CS/2-1.5,3,3);
    }
  }
  // Anim cells
  for(const a of animCells) drawCell(gx,a.c*CS,a.r*CS,CS,a.t,a.a);
  // Ghost preview
  if(dragging){
    const p=pieces[dragging.pi];
    if(p && dragging.gr>=0){
      const ok=canPlace(dragging.pi,dragging.gr,dragging.gc);
      for(let r=0;r<p.s.length;r++) for(let c=0;c<p.s[r].length;c++){
        if(!p.s[r][c])continue;
        const pr=dragging.gr+r,pc=dragging.gc+c;
        if(pr<0||pr>=GRID||pc<0||pc>=GRID)continue;
        if(ok){
          drawCell(gx,pc*CS,pr*CS,CS,p.t,.42);
        }else{
          gx.fillStyle='rgba(255,50,50,.22)';
          rr(gx,pc*CS+2,pr*CS+2,CS-4,CS-4,3);gx.fill();
        }
      }
    }
  }
  // Particles
  for(const p of particles){
    gx.save();
    gx.globalAlpha=p.a;
    if(p.star){
      gx.fillStyle=p.c;
      drawStar(gx,p.x,p.y,p.r);
    }else{
      gx.fillStyle=p.c;
      gx.beginPath();gx.arc(p.x,p.y,p.r,0,Math.PI*2);gx.fill();
    }
    gx.restore();
  }
}

function drawStar(ctx,x,y,r){
  ctx.beginPath();
  for(let i=0;i<8;i++){
    const ang=i*Math.PI/4;
    const rad=i%2===0?r:r*.4;
    if(i===0)ctx.moveTo(x+rad*Math.cos(ang),y+rad*Math.sin(ang));
    else ctx.lineTo(x+rad*Math.cos(ang),y+rad*Math.sin(ang));
  }
  ctx.closePath();ctx.fill();
}

// ── Piece Tray ───────────────────────────────
function refreshPiecePositions(){
  const csz=PCS(), W=PW/N_SLOTS;
  for(let i=0;i<N_SLOTS;i++){
    const p=pieces[i];if(!p)continue;
    const rows=p.s.length,cols=p.s[0].length;
    p._x=i*W; p._w=W;
    p._sx=i*W+(W-cols*csz)/2;
    p._sy=(PH-rows*csz)/2;
    p._csz=csz;
  }
}

function drawPieces(){
  px.clearRect(0,0,PW,PH);
  const W=PW/N_SLOTS;
  for(let i=0;i<N_SLOTS;i++){
    const p=pieces[i];
    const isDrag=dragging&&dragging.pi===i;
    // Slot background
    const slotBg=px.createLinearGradient(i*W,0,i*W+W,PH);
    slotBg.addColorStop(0,'rgba(15,52,96,.6)');
    slotBg.addColorStop(1,'rgba(26,26,110,.3)');
    px.fillStyle=slotBg;
    rr(px,i*W+3,3,W-6,PH-6,6);px.fill();
    px.strokeStyle=isDrag?'rgba(255,203,5,.9)':'rgba(255,203,5,.22)';
    px.lineWidth=isDrag?1.8:1;
    rr(px,i*W+3,3,W-6,PH-6,6);px.stroke();
    if(!p)continue;
    const rows=p.s.length,cols=p.s[0].length;
    const csz=p._csz||PCS();
    const sx=p._sx||i*W+(W-cols*csz)/2;
    const sy=p._sy||(PH-rows*csz)/2;
    const alpha=isDrag?.2:1;
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      if(p.s[r][c]) drawCell(px,sx+c*csz,sy+r*csz,csz,p.t,alpha);
    }
  }
}

// ── Drag System (GPU accelerated, 0ms lag) ───
function pieceAt(rawX){
  for(let i=0;i<N_SLOTS;i++){
    const p=pieces[i];if(!p)continue;
    const x=p._x||0,w=p._w||PW/N_SLOTS;
    if(rawX>=x&&rawX<x+w)return i;
  }
  return -1;
}

function buildDrag(p){
  const rows=p.s.length,cols=p.s[0].length;
  const cw=cols*CS,ch=rows*CS;
  drc.style.width=cw+'px';drc.style.height=ch+'px';
  drc.width=Math.round(cw*DPR);drc.height=Math.round(ch*DPR);
  dx.setTransform(DPR,0,0,DPR,0,0);
  dx.clearRect(0,0,cw,ch);
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    if(p.s[r][c]) drawCell(dx,c*CS,r*CS,CS,p.t,1);
  }
  drc.style.display='block';
  return {w:cw,h:ch};
}

function startDrag(cx,cy,srcX,isTouch){
  const idx=pieceAt(srcX); if(idx<0)return;
  const p=pieces[idx];
  const {w,h}=buildDrag(p);
  dragging={pi:idx,isTouch,gr:-1,gc:-1,w,h};
  moveDrag(cx,cy);
  drawPieces();
}

function moveDrag(cx,cy){
  if(!dragging)return;
  // Touch: lift block 80px above finger so it's always visible
  const liftY=dragging.isTouch?80:dragging.h/2;
  const bx=cx-dragging.w/2, by=cy-liftY-dragging.h/2;
  // Instant GPU transform
  drc.style.transform=`translate3d(${bx}px,${by}px,0)`;
  // Update ghost snap
  const rect=gc.getBoundingClientRect();
  dragging.gc=Math.round((bx-rect.left)/CS);
  dragging.gr=Math.round((by-rect.top)/CS);
}

function endDrag(){
  if(!dragging)return;
  drc.style.display='none';
  const placed=tryPlace(dragging.pi,dragging.gr,dragging.gc);
  dragging=null;
  if(!placed)drawPieces();
}

// ── Events ───────────────────────────────────
pc.addEventListener('touchstart',e=>{
  e.preventDefault();if(gameOver)return;
  const r=pc.getBoundingClientRect(),t=e.touches[0];
  startDrag(t.clientX,t.clientY,t.clientX-r.left,true);
},{passive:false});

pc.addEventListener('mousedown',e=>{
  e.preventDefault();if(gameOver)return;
  const r=pc.getBoundingClientRect();
  startDrag(e.clientX,e.clientY,e.clientX-r.left,false);
});

window.addEventListener('touchmove',e=>{
  if(!dragging)return;e.preventDefault();
  moveDrag(e.touches[0].clientX,e.touches[0].clientY);
},{passive:false});
window.addEventListener('touchend',e=>{
  if(!dragging)return;e.preventDefault();endDrag();
},{passive:false});
window.addEventListener('mousemove',e=>{if(dragging)moveDrag(e.clientX,e.clientY);});
window.addEventListener('mouseup',  e=>{if(dragging)endDrag();});

// ── Game Logic ───────────────────────────────
function canPlace(pi,row,col){
  const p=pieces[pi];if(!p)return false;
  for(let r=0;r<p.s.length;r++) for(let c=0;c<p.s[r].length;c++){
    if(!p.s[r][c])continue;
    const pr=row+r,pc=col+c;
    if(pr<0||pr>=GRID||pc<0||pc>=GRID||grid[pr][pc])return false;
  }
  return true;
}

function tryPlace(pi,row,col){
  if(!canPlace(pi,row,col))return false;
  const p=pieces[pi];
  for(let r=0;r<p.s.length;r++) for(let c=0;c<p.s[r].length;c++){
    if(p.s[r][c])grid[row+r][col+c]=p.t;
  }
  pieces[pi]=null;
  addScore(p.s.flat().filter(Boolean).length*10*level);
  sfxPlace();
  checkLines();
  if(pieces.every(p=>p===null)){ genPieces(); refreshPiecePositions(); }
  checkGameOver();
  updateUI(); drawPieces();
  return true;
}

function checkLines(){
  const rows=[],cols=[];
  for(let r=0;r<GRID;r++) if(grid[r].every(c=>c!==null))rows.push(r);
  for(let c=0;c<GRID;c++) if(grid.every(row=>row[c]!==null))cols.push(c);
  if(!rows.length&&!cols.length){resetCombo();return;}
  const cells=new Set();
  rows.forEach(r=>{for(let c=0;c<GRID;c++)cells.add(`${r},${c}`);});
  cols.forEach(c=>{for(let r=0;r<GRID;r++)cells.add(`${r},${c}`);});
  animClear([...cells],rows,cols,rows.length+cols.length);
}

function animClear(cells,rows,cols,n){
  // Spawn lots of particles from cleared cells
  cells.forEach(k=>{
    const [r,c]=k.split(',').map(Number);
    if(grid[r][c]) spawnBurst(c*CS+CS/2,r*CS+CS/2,grid[r][c].g,12);
  });
  let f=0;
  const iv=setInterval(()=>{
    animCells=cells.map(k=>{
      const [r,c]=k.split(',').map(Number);
      return{r,c,t:grid[r][c]||TYPES[0],a:f%2===0?.98:.18};
    });
    if(++f>=8){clearInterval(iv);animCells=[];doLineClear(rows,cols,n);}
    drawGrid();
  },45); // Fast flash
}

function doLineClear(rows,cols,n){
  rows.forEach(r=>{grid[r]=Array(GRID).fill(null);});
  cols.forEach(c=>{for(let r=0;r<GRID;r++)grid[r][c]=null;});
  linesCleared+=n;
  const pts=(n*100*level+(combo-1)*50*level)*combo;
  addScore(pts); combo++;
  // Choose effect based on n and combo
  const isCombo=combo>2;
  if(isCombo){ sfxCombo(combo); showComboToast(`COMBO x${combo}! ⚡`); }
  else sfxClear(n);
  triggerClearFX(n,isCombo);
  showClearLabel(n,combo);
  clearTimeout(comboTimer); comboTimer=setTimeout(resetCombo,2800);
  xp+=n*80+combo*15; checkLevel();
  partnerHp=Math.min(partner.hp,partnerHp+n*6);
  showScorePop('+'+pts.toLocaleString());
  updateUI(); drawGrid(); drawPieces();
}

function triggerClearFX(n,isCombo){
  const box=document.getElementById('gbox');
  box.classList.remove('flash','shake');
  // Force reflow
  void box.offsetWidth;
  box.classList.add('flash');
  if(n>=2||isCombo) box.classList.add('shake');
  // Remove classes after animation
  setTimeout(()=>box.classList.remove('flash','shake'),600);
}

function showClearLabel(n,cmb){
  const msgs=['','NICE!','DOUBLE! 🔥','TRIPLE! 💥','AMAZING! ✨'];
  let msg=n>=4?'AMAZING! ✨':(msgs[n]||'NICE!');
  if(cmb>2)msg=`FEVER! x${cmb} 🎉`;
  const box=document.getElementById('gbox');
  const el=document.createElement('div');
  el.className='clearText'; el.textContent=msg;
  el.style.top=(GH*0.35)+'px';
  box.appendChild(el);
  setTimeout(()=>el.remove(),1100);
}

function resetCombo(){ combo=1; updateUI(); }

function addScore(pts){
  score+=pts;
  if(score>best){best=score;localStorage.setItem('pkblast4_best',best);}
}

function checkLevel(){
  while(xp>=xpMax){
    xp-=xpMax; level++; xpMax=Math.floor(xpMax*1.4);
    partner=PARTNERS[(level-1)%PARTNERS.length];
    partnerHp=partner.hp;
    sfxLvlUp();
    showComboToast(`LEVEL UP! Lv.${level} 🎉`);
    for(let r=0;r<GRID;r++) for(let c=0;c<GRID;c++){
      if(grid[r][c])spawnBurst(c*CS+CS/2,r*CS+CS/2,'#FFCB05',5);
    }
  }
}

function checkGameOver(){
  for(let i=0;i<N_SLOTS;i++){
    if(!pieces[i])continue;
    for(let r=0;r<GRID;r++) for(let c=0;c<GRID;c++) if(canPlace(i,r,c))return;
  }
  sfxGameOver(); gameOver=true;
  document.getElementById('goPartner').textContent=partner.e+' '+partner.n+' fainted!';
  document.getElementById('goScore').textContent='Score: '+score.toLocaleString();
  document.getElementById('goBest').textContent='Best:  '+best.toLocaleString();
  setTimeout(()=>document.getElementById('overlay').classList.remove('hidden'),700);
}

function initGame(){
  grid=Array.from({length:GRID},()=>Array(GRID).fill(null));
  genPieces();
  score=0; best=parseInt(localStorage.getItem('pkblast4_best')||'0');
  level=1; xp=0; xpMax=500;
  combo=1; comboTimer=null; linesCleared=0;
  partner=PARTNERS[Math.floor(Math.random()*PARTNERS.length)];
  partnerHp=partner.hp;
  gameOver=false; dragging=null; animCells=[]; particles=[];
  drc.style.display='none';
  clearTimeout(comboTimer);
  document.getElementById('overlay').classList.add('hidden');
  calcSizes(); // also calls refreshPiecePositions
  updateUI(); drawGrid(); drawPieces();
}
function restartGame(){ initGame(); }

function genPieces(){
  pieces=Array.from({length:N_SLOTS},()=>({s:rndShape(),t:TYPES[Math.floor(Math.random()*TYPES.length)]}));
}

// ── UI ────────────────────────────────────────
function updateUI(){
  document.getElementById('scoreVal').textContent=score.toLocaleString();
  document.getElementById('bestVal').textContent=best.toLocaleString();
  document.getElementById('lvVal').textContent=level;
  document.getElementById('comboVal').textContent='x'+combo;
  document.getElementById('linesVal').textContent=linesCleared;
  document.getElementById('xpFill').style.width=Math.min(100,Math.floor(xp/xpMax*100))+'%';
  document.getElementById('pEmoji').textContent=partner.e;
  document.getElementById('pName').textContent=partner.n;
  const hp=Math.max(0,Math.floor(partnerHp/partner.hp*100));
  const f=document.getElementById('hpFill');
  f.style.width=hp+'%';
  f.style.background=hp>50?'linear-gradient(90deg,#4CAF50,#8BC34A)':
                    hp>25?'linear-gradient(90deg,#FFC107,#FF9800)':
                          'linear-gradient(90deg,#f44336,#FF5722)';
}

function showScorePop(txt){
  const box=document.getElementById('gbox');
  const el=document.createElement('div');
  el.className='spop'; el.textContent=txt;
  el.style.left=(GW/2+8)+'px'; el.style.top=(GH/3+4)+'px';
  box.appendChild(el);
  setTimeout(()=>el.remove(),920);
}

let toastTmr;
function showComboToast(msg){
  const el=document.getElementById('comboToast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTmr);
  toastTmr=setTimeout(()=>el.classList.remove('show'),1350);
}

// ── Particles ────────────────────────────────
function spawnBurst(x,y,color,n){
  const golds=['#FFD700','#FFC200','#FFE066','#FFA500'];
  for(let i=0;i<n;i++){
    const ang=(Math.PI*2*i/n)+Math.random()*.5;
    const spd=Math.random()*7+3.5;
    const isStar=i%3===0;
    const c=i%4===0?golds[Math.floor(Math.random()*golds.length)]:color;
    particles.push({
      x,y,c,
      r:isStar?Math.random()*4+2:Math.random()*3.5+1.5,
      vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,
      a:1,star:isStar
    });
  }
}

function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.22;
    p.vx*=.97; // slight drag
    p.a-=.024;
    if(p.a<=0)particles.splice(i,1);
  }
}

// ── Game Loop ─────────────────────────────────
function loop(){
  if(!gameOver){ updateParticles(); drawGrid(); drawPieces(); }
  requestAnimationFrame(loop);
}

window.addEventListener('resize',()=>{
  clearTimeout(window._rt);
  window._rt=setTimeout(()=>{ calcSizes(); drawGrid(); drawPieces(); },100);
});
window.addEventListener('orientationchange',()=>{
  setTimeout(()=>{ calcSizes(); drawGrid(); drawPieces(); },220);
});
document.addEventListener('keydown',e=>{ if(e.key==='r'||e.key==='R')restartGame(); });

initGame();
requestAnimationFrame(loop);
</script>
